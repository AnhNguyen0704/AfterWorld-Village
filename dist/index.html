<!doctype html>
<!-- index.html - change the title, the copy in <header>, and add controls next to #control.
     Keep #world, #error, #views and #control: the capture script and the viewer contract use them. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anh Nguyen World — Golden Hour</title>
    <script type="module" crossorigin src="/assets/index-BrbYIpmZ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CEfajpS0.css">
  </head>
  <body>
    <main class="layout">
      <div class="viewport" aria-busy="true">
        <canvas id="world" aria-label="Three-dimensional scene"></canvas>
        <p id="error" role="alert" hidden></p>
      </div>
      <aside class="panel">
        <header>
          <p class="eyebrow">Anh Nguyen / Personal world</p>
          <h1>Những chiều yên</h1>

        </header>
        <nav id="views" aria-label="Camera views"></nav>
        <p class="controls">
          <button id="control" type="button" aria-pressed="false">Pause motion</button>
          <button id="lighting" type="button" aria-pressed="true">Golden hour on</button>
          <button id="reset" type="button">Reset view</button>
        </p>
      </aside>
    </main>
  </body>
</html>
